name: Package and sign

on:
  push:
    branches:
      - test
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to build'
        required: true
        type: string

jobs:
  build:
    # These permissions are needed to create a sigstore certificate.
    permissions:
      id-token: write
      contents: read
      attestations: write

    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update recipe version
        if: github.event_name == 'workflow_dispatch'
        run: |
          sed -i 's/version: ".*"/version: "${{ github.event.inputs.version }}"/' conda.recipe/recipe.yaml
          cat conda.recipe/recipe.yaml

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.34
        with:
          rattler-build-version: "v0.57.0"

      # Note: no API keys needed because we have configured a trusted publisher!
      - name: Upload the package
        run: |
          rattler-build publish --recipe ./conda.recipe/recipe.yaml \
            --to https://beta.prefix.dev/wolf-channel \
            --build-number=+1 \
            --generate-attestation
