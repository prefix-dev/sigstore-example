name: Package and sign

on:
  push:
    branches:
      - test
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to build'
        required: true
        type: string
      channel:
        description: 'Channel to publish to'
        required: true
        type: string
        default: 'wolf-channel'
      server:
        description: 'Prefix server URL'
        required: true
        type: string
        default: 'https://beta.prefix.dev/'

jobs:
  build:
    # These permissions are needed to create a sigstore certificate.
    permissions:
      id-token: write
      contents: read
      attestations: write

    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Get rattler-build, but actually ignore the build output from it
      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.34
        with:
          rattler-build-version: 'v0.55.1'

      # Note: no API keys needed because we have configured a trusted publisher!
      - name: Upload the package
        run: |
          rattler-build publish ./conda.recipe \
            --build-number=+1 \
            --to ${{ inputs.server || 'https://beta.prefix.dev/' }}/${{ inputs.channel || 'wolf-channel' }} \
            --generate-attestation
